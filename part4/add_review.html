<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span>🏠</span> HBNB
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" id="login-link">Login</a>
                <button class="logout-button" id="logout-button" style="display: none;" onclick="handleLogout()">Logout</button>
            </div>
        </nav>
    </header>

    <main>
        <div class="review-container">
            <h1>Add Your Review</h1>
            
            <div id="success-message" class="success-message" style="display: none;"></div>
            <div id="error-message" class="error-message" style="display: none;"></div>

            <form id="review-form" class="form">
                <fieldset>
                    <legend>Review Form</legend>

                    <div>
                        <label for="rating">Rating</label>
                        <select id="rating" name="rating" required>
                            <option value="">Select a rating</option>
                            <option value="1">1 Star - Poor</option>
                            <option value="2">2 Stars - Fair</option>
                            <option value="3">3 Stars - Good</option>
                            <option value="4">4 Stars - Very Good</option>
                            <option value="5">5 Stars - Excellent</option>
                        </select>
                    </div>

                    <div>
                        <label for="comment">Your Review</label>
                        <textarea id="comment" name="comment" placeholder="Share your experience with this place..." required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit Review</button>
                        <a href="#" id="back-link" class="cancel-link">Back to Place</a>
                    </div>
                </fieldset>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 HBNB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
    <script src="add_review.js"></script>
</body>
</html>
