<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span>🏠</span> HBNB
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" id="login-link">Login</a>
                <button class="logout-button" id="logout-button" style="display: none;" onclick="handleLogout()">Logout</button>
            </div>
        </nav>
    </header>

    <main>
        <h1>Available Places</h1>
        
        <section id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="0">All Prices</option>
                <option value="10">Up to $10</option>
                <option value="50">Up to $50</option>
                <option value="100">Up to $100</option>
            </select>
        </section>

        <section id="places-list">
            <!-- List of places will be populated dynamically -->
        </section>
    </main>

    <footer>
        <p>&copy; 2024 HBNB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
