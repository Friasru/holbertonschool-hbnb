<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBNB - List of Places</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <span>🏠</span> HBNB
        </a>
        <button class="login-button" id="authBtn">Login</button>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <main>
        <h1>Available Places</h1>
        <section class="places-container" id="placesList">
            <!-- Places will be dynamically loaded here -->
        </section>
    </main>

    <footer>
        <p>&copy; 2024 HBNB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
    <script>
        function loadPlaces() {
            const placesList = document.getElementById('placesList');
            placesList.innerHTML = '';

            places.forEach(place => {
                const article = document.createElement('article');
                article.classList.add('place-card');
                article.innerHTML = `
                    <h3>${place.name}</h3>
                    <div class="price">
                        <span class="price-label">$ ${place.price}</span>
                        <span> per night</span>
                    </div>
                    <a href="place.html?id=${place.id}" class="details-button">View Details</a>
                `;
                placesList.appendChild(article);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadPlaces();
            updateAuthButton();
        });
    </script>
</body>
</html>
