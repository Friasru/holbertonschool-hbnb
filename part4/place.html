<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span>🏠</span> HBNB
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" id="login-link">Login</a>
                <button class="logout-button" id="logout-button" style="display: none;" onclick="handleLogout()">Logout</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="place-details">
            <!-- Place details will be populated dynamically -->
        </section>

        <section id="reviews-section">
            <h2>Reviews</h2>
            <div id="reviews-list">
                <!-- Reviews will be populated dynamically -->
            </div>
        </section>

        <section id="add-review" style="display: none;">
            <form id="review-form">
                <fieldset>
                    <legend>Add Your Review</legend>

                    <div>
                        <label for="rating">Rating</label>
                        <select id="rating" name="rating" required>
                            <option value="">Select a rating</option>
                            <option value="1">1 Star</option>
                            <option value="2">2 Stars</option>
                            <option value="3">3 Stars</option>
                            <option value="4">4 Stars</option>
                            <option value="5">5 Stars</option>
                        </select>
                    </div>

                    <div>
                        <label for="comment">Your Review</label>
                        <textarea id="comment" name="comment" placeholder="Share your experience with this place..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Submit Review</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 HBNB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
    <script src="place_details.js"></script>
</body>
</html>
